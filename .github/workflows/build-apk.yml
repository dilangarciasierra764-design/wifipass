name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar salida
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/WifiPass-v2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WifiPass-apk
          path: out/WifiPass-v2.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WifiPass v2 (build ${{ github.run_number }})
          body: APK firmado en modo debug, listo para instalar.
          files: out/WifiPass-v2.apk
